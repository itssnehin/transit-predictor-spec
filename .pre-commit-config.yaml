# Run `uv run pre-commit install` once to enable, then `uv run pre-commit run --all-files`.
# Refresh pinned revs with `uv run pre-commit autoupdate`.
# gitleaks requires the gitleaks binary (or Go) available to pre-commit; see docs/DECISIONS.md ADR 0006.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, via uv)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
