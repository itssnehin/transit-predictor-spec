# Local stack — Phase 1 adds the ingester and sink services on top of the
# Phase 0 base (Redpanda, MinIO, Postgres). Run `make bootstrap` after the
# first `make up` to create Kafka topics and MinIO buckets.
# See specs/INFRA.md for the full planned service inventory.
name: transit-predictor

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Two listeners:
      #   INTERNAL — used by other Docker containers (ingester, sink)
      #   EXTERNAL — used by tools on the host machine (rpk CLI, test scripts)
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
    ports:
      - "19092:19092"  # Kafka API (host access — use localhost:19092 from outside Docker)
      - "9644:9644"    # Admin API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1500M

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      # MinIO exposes a liveness endpoint; verify curl is present on first `make up`.
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transit}
      POSTGRES_DB: ${POSTGRES_DB:-transit}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transit} -d ${POSTGRES_DB:-transit}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  ingester:
    build:
      context: .
      dockerfile: services/ingester/Dockerfile
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "9100:9100"   # Prometheus metrics + health probes
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  sink:
    build:
      context: .
      dockerfile: services/sink/Dockerfile
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  stream_processor:
    build:
      context: .
      dockerfile: services/stream_processor/Dockerfile
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      MINIO_ENDPOINT: http://minio:9000
      POSTGRES_HOST: postgres
      STREAM_STARTING_OFFSETS: latest
      # /tmp is writable by the non-root sparkuser. We deliberately do NOT mount
      # named volumes here: Docker creates them root-owned, which blocks the
      # non-root user from writing the Ivy cache (~/.ivy2) and the checkpoint.
      # Trade-off: the Kafka connector JAR re-downloads on container *recreate*
      # (not on restart). A future hardening step bakes the JARs into the image.
      STREAM_CHECKPOINT_LOCATION: /tmp/spark-checkpoints
    depends_on:
      redpanda:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2560M   # Spark driver+executor in one JVM; ~2 GB heap headroom

volumes:
  redpanda-data:
  minio-data:
  postgres-data:
