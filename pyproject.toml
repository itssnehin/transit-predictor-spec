[project]
name = "transit-predictor"
version = "0.1.0"
description = "Real-time bus arrival delay prediction for Brisbane (TransLink GTFS-Realtime)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "httpx>=0.27,<0.29",
    "gtfs-realtime-bindings>=1.0,<2.0",
    # Kafka producer/consumer (confluent official client, faster than kafka-python)
    "confluent-kafka>=2.5,<3.0",
    # Prometheus metrics exposition
    "prometheus-client>=0.20,<1.0",
    # MinIO/S3 writes (boto3 works with both local MinIO and AWS S3 via endpoint_url)
    "boto3>=1.34,<2.0",
    # Postgres driver for the static GTFS loader. The [binary] extra ships a
    # prebuilt libpq so no local C toolchain is needed (matters on Windows).
    "psycopg[binary]>=3.1,<4.0",
]

[project.optional-dependencies]
# Spark is only needed by the stream_processor service. Kept as an extra so the
# lean ingester/sink images (which `uv sync` without extras) don't pull ~300 MB
# of PySpark. The stream_processor Dockerfile installs it with `--extra spark`.
spark = [
    "pyspark>=3.5,<3.6",  # local[*] mode; Kafka/S3A connectors pulled as Maven packages
]

[dependency-groups]
dev = [
    "ruff>=0.11,<0.12",
    "mypy>=1.15,<2.0",
    "pytest>=8.0,<9.0",
    "pre-commit>=4.0,<5.0",
    # HTTP mock for httpx (used in feed poller tests)
    "respx>=0.21,<1.0",
    # Integration test containers (RedpandaContainer is in the kafka extra)
    "testcontainers[kafka]>=4.8,<5.0",
    # Analysis stack for notebooks/ (Phase 2e sanity checks onward). Dev-only:
    # none of the service images install the dev group.
    "pandas>=2.2,<3.0",
    "pyarrow>=17.0,<22.0",
    "matplotlib>=3.9,<4.0",
    "notebook>=7.2,<8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "D"]
# D203/D213 conflict with D211/D212 (Google convention); disable the conflicting pair.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests don't require full type annotations or docstrings.
"**/tests/**" = ["ANN", "D"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["services"]
# Tests exercise untyped third-party protobuf APIs; ruff + pytest cover them instead.
exclude = ["/tests/"]

[[tool.mypy.overrides]]
# gtfs-realtime-bindings ships generated protobuf modules without type stubs.
module = ["google.transit.*", "google.protobuf.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# confluent-kafka and boto3 ship no PEP-561 stubs.
module = ["confluent_kafka.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pyspark is an optional extra not installed in the host/dev venv (it lives only
# in the stream_processor container). ignore_missing_imports lets mypy check the
# stream_processor glue on the host without PySpark present. The pure ground-truth
# logic carries no pyspark imports and stays fully strict-typed.
module = ["pyspark.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services", "tests"]
addopts = "-ra"
markers = [
    "integration: tests that require Docker or external services (deselect with -m 'not integration')",
]
